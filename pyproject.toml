[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-context-compiler"
version = "0.5.0"
description = "Deterministic, local-first context optimization for LLM prompts: clean, dedupe, structure, and measure token and cost savings before calling a large model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Local Context Compiler contributors" }]
keywords = [
  "openai",
  "tiktoken",
  "prompt-engineering",
  "cli",
  "python",
  "llm-tools",
  "context-optimization",
  "llm",
  "tokens",
  "prompt",
  "context",
  "cost",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: General",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# tiktoken enables EXACT token counting; lcc falls back to a heuristic without it.
tiktoken = ["tiktoken>=0.7"]
# laya enables the local non-autoregressive System 1 decision engine.
laya = [
  "laya>=0.3.0",
  "torch>=2.0.0",
  "transformers>=4.45.0",
  "safetensors>=0.4.0",
  "huggingface_hub>=0.20.0",
  "numpy>=1.20.0",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "tiktoken>=0.7",
  "twine>=5.0",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/lucasmartins-ai/lcc"
Repository = "https://github.com/lucasmartins-ai/lcc"
Issues = "https://github.com/lucasmartins-ai/lcc/issues"


[project.scripts]
lcc = "lcc.cli:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lcc = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "act2_router", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Compatibility facades intentionally re-export their public modules.
"act2_router/*" = ["F403"]
# Benchmark evidence and fixed-width output contain intentionally long lines.
"benchmarks/research/*.py" = ["E501"]
# Typer expects callables (typer.Option/Argument) as parameter defaults.
"src/lcc/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.11"
mypy_path = "src:."
packages = ["lcc", "act2_router"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

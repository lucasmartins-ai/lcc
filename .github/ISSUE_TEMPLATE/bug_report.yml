name: 🐛 Bug Report
description: Report a bug or unexpected behavior to help improve the project
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Exact commands or code snippet used.
      placeholder: |
        1. Run `...`
        2. With inputs `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python/Node/Go version, Docker version.
      placeholder: |
        - OS: macOS 15.0 / Ubuntu 24.04
        - Version: v1.0.0

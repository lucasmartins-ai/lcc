name: Invariant fuzz (nightly)

# Runs the invariant harness (tests/invariants.py) for 600 s on synthetic transcripts only:
# every input is generated by tests/test_invariants_fuzz.py, never a session. It is not a
# required check and does not gate pull requests. The seed log and any shrunk failing input
# are uploaded as an artifact; to keep a failure, copy it into tests/corpus/adversarial/.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,tiktoken]"
    - name: Fuzz the invariants (600 s)
      env:
        LCC_FUZZ_SECONDS: "600"
        LCC_FUZZ_ARTIFACTS: ${{ runner.temp }}/fuzz
      run: |
        pytest -q tests/test_invariants_fuzz.py
    - name: Upload seeds and any failing input
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: invariant-fuzz-${{ github.run_id }}
        path: ${{ runner.temp }}/fuzz
        if-no-files-found: ignore
        retention-days: 14

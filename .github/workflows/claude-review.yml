name: Claude review

# Reviews every PR and triages every new issue. Mention @claude in any
# comment to ask a follow-up. Needs the CLAUDE_CODE_OAUTH_TOKEN secret
# (`claude setup-token`) and the Claude GitHub app installed on the repo.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  pr-review:
    # Fork PRs get no secrets, so the action could only fail there: review those by hand.
    if: |
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md / CLAUDE.md / CONTEXT.md first.
            Focus on correctness bugs, security, determinism of the compactor,
            missing tests, and breaking changes to the CLI, MCP or plugin surface.
            Skip style nits that ruff already enforces.
            Put line-specific findings as inline comments; put a short summary
            (verdict + top risks) as one PR comment. If nothing is wrong, say so in one line.
            Never add a "Generated with Claude Code" footer or any AI attribution.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  issue-triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            Triage this issue. Read it, find the code it refers to, and check
            whether it is reproducible from the source. Then:
            - apply existing labels only (`gh label list`), e.g. bug / enhancement /
              needs-info / ready-for-agent;
            - post one comment: likely root cause with file:line, suggested fix,
              and what info is missing if any.
            Do not edit code or open PRs.
            Never add a "Generated with Claude Code" footer or any AI attribution.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh label list:*),Bash(gh search:*)"

  mention:
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,tiktoken]"
    - name: Run Pytest Suite
      run: |
        pytest -q
    - name: Invariant fuzz (60 s budget, tests/invariants.py)
      if: matrix.python-version == '3.13'
      env:
        LCC_FUZZ_SECONDS: "60"
      run: |
        pytest -q tests/test_invariants_fuzz.py -k generated
    - name: Lint (ruff)
      run: |
        ruff check .
    - name: Typecheck (mypy)
      run: |
        mypy
    - name: Build and check distributions
      run: |
        python -m build
        twine check --strict dist/*
    - name: Answer-level regression (E0)
      run: |
        python3 benchmarks/research/run_answer_eval.py --provider mechanical
    - name: Multi-agent pilot smoke (E0/E1/E2)
      run: |
        python3 benchmarks/research/run_multiagent_ab.py --tasks 20 --provider mechanical
        python3 benchmarks/research/run_injection_e2e.py
    - name: Judge benchmark smoke (synthetic, gated on no crash + recall floors)
      run: |
        python3 benchmarks/run_judge_bench.py --check --out "$RUNNER_TEMP/judge-bench"
    - name: Prefix stability smoke (cache contract invariants, synthetic, no network)
      run: |
        python3 benchmarks/cache/run_prefix_stability.py --check --out "$RUNNER_TEMP/prefix-stability"

  test-node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'
    - name: Run Node Tests
      run: |
        npm test

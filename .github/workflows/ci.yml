name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,tiktoken]"
    - name: Run Pytest Suite
      run: |
        pytest -q
    - name: Lint (ruff)
      run: |
        ruff check src tests benchmarks/research/run_multiagent_ab.py benchmarks/research/run_injection_e2e.py src/lcc/relevance/verifier.py || true
    - name: Typecheck (mypy)
      run: |
        mypy src/lcc/relevance/verifier.py src/lcc/relevance/compactor.py src/lcc/relevance/trim.py || true
    - name: Answer-level regression (E0)
      run: |
        python3 benchmarks/research/run_answer_eval.py --provider mechanical
    - name: Multi-agent pilot smoke (E0/E1/E2)
      run: |
        python3 benchmarks/research/run_multiagent_ab.py --tasks 20 --provider mechanical
        python3 benchmarks/research/run_injection_e2e.py

  test-node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run Node Tests
      run: |
        node test/index.test.js

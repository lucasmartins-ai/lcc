router:
  local_first_max_tokens: 3500
  compress_if_projected_savings_above: 0.12
  remote_direct_if_input_tokens_above: 16000
  escalate_if_manual_review: true
  local_accept_confidence: 0.82
  strict_format_requires_verification: true
  compress_before_remote: true

risk:
  calculation_keywords:
    - calculate
    - compute
    - numeric
    - percentage
    - sum
    - total
    - add
    - subtract
    - multiply
    - divide
    - average
    - ratio
  code_keywords:
    - python
    - javascript
    - function
    - bug
    - error
  strict_format_markers:
    - json
    - csv
    - yaml
    - exactly
    - schema
    - markdown table
  external_knowledge_keywords:
    - latest
    - current
    - today
    - internet
    - web
    - outside context
